<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buana Studio | Contact</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        input, select, textarea {
            width: 100%;
            padding: 1.5rem;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-strong);
            color: var(--text-main);
            font-family: var(--font-sans);
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-bottom-color: var(--accent-primary);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-flex">
            <a href="index.html" class="logo">Buana Studio</a>
            <div class="nav-desktop">
                <a href="index.html">Home</a>
                <a href="journal.html">Journal</a>
                <a href="essentials.html">Essentials</a>
                <a href="contact.html">Contact</a>
            </div>
            <div class="hamburger"></div>
        </div>
    </nav>

    <section class="hero" style="padding-top: 12rem;">
        <div class="container flex-col gap-4 reveal">
            <span class="label-small">Begin</span>
            <h1 style="font-size: 4rem; letter-spacing: -0.02em;">Consultation.</h1>
            <p class="lead" style="margin-left: 0;">Every project begins with clarity.</p>
        </div>
    </section>

    <section class="section">
        <div class="container reveal">
            <form style="max-width: 600px;">
                <input type="email" placeholder="Email Address">
                <select>
                    <option>Systems & Practical Guidance</option>
                    <option>Guided Learning</option>
                    <option>Practice & Discipline</option>
                    <option>Studio Essentials</option>
                </select>
                <textarea rows="5" placeholder="Details"></textarea>
                <button type="button" class="btn btn-primary" style="width: 100%; padding: 1.5rem;">Submit</button>
            </form>

            <div style="margin-top: 8rem; opacity: 0.5;">
                <p>Jalan Bunga Mas No. 6,<br> Bandung 40614, Indonesia</p>
                <a href="mailto:contact@buanastudio.com" class="text-main" style="text-decoration: none;">contact@buanastudio.com</a>
            </div>
        </div>
    </section>

    <footer class="footer" style="padding: 4rem 0; opacity: 0.5;">
        <div class="container">
            <div class="footer-flex">
                <span class="logo">Buana Studio</span>
            </div>
        </div>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach((el) => { observer.observe(el); });
        });
    </script>
</body>
</html>
