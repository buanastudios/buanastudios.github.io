<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buana Studio | Journal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-flex">
            <a href="index.html" class="logo">Buana Studio</a>
            <div class="nav-desktop">
                <a href="index.html">Home</a>
                <a href="journal.html">Journal</a>
                <a href="objects.html">Objects</a>
                <a href="contact.html">Contact</a>
            </div>
            <div class="hamburger"></div>
        </div>
    </nav>

    <section class="hero" style="padding-top: 12rem;">
        <div class="container flex-col gap-4 reveal">
            <span class="label-small">Journal</span>
            <h1 style="font-size: 4rem;">Insights.</h1>
            <p class="lead" style="margin-left: 0;">Thoughtful explorations of systems and discipline.</p>
        </div>
    </section>

    <section class="section">
        <div class="container flex-col gap-2">
            
            <div class="shelf-item reveal">
                <a href="#" style="text-decoration: none; color: inherit; width: 100%; display: flex; justify-content: space-between; align-items: flex-end;">
                    <div>
                        <span class="label-small">Architecture</span>
                        <h3>Designing for Edge Cases</h3>
                    </div>
                    <span>Read</span>
                </a>
            </div>

            <div class="shelf-item reveal">
                <a href="#" style="text-decoration: none; color: inherit; width: 100%; display: flex; justify-content: space-between; align-items: flex-end;">
                    <div>
                        <span class="label-small">Capability</span>
                        <h3>Applying Systems Thinking to Homeschooling</h3>
                    </div>
                    <span>Read</span>
                </a>
            </div>

            <div class="shelf-item reveal">
                <a href="#" style="text-decoration: none; color: inherit; width: 100%; display: flex; justify-content: space-between; align-items: flex-end;">
                    <div>
                        <span class="label-small">Discipline</span>
                        <h3>The Focus of Archery</h3>
                    </div>
                    <span>Read</span>
                </a>
            </div>

        </div>
    </section>

    <footer class="footer" style="padding: 4rem 0; opacity: 0.5;">
        <div class="container">
            <div class="footer-flex">
                <span class="logo">Buana Studio</span>
            </div>
        </div>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach((el) => { observer.observe(el); });
        });
    </script>
</body>
</html>
